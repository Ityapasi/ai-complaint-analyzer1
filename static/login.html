<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Complaint Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        #errorMsg { color: red; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Civic Portal Login</h2>
    <p>Sign in to access the system</p>

    <input type="text" id="username" placeholder="Username (admin or citizen)" required>
    <input type="password" id="password" placeholder="Password (admin123 or citizen123)" required>

    <button onclick="attemptLogin()">Secure Login</button>
    <div id="errorMsg"></div>
</div>

<script>
    async function attemptLogin() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        const errorMsg = document.getElementById("errorMsg");

        const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: u, password: p })
        });

        const data = await res.json();
        if (data.status === "success") {
            // Save JWT token and Role to local storage
            localStorage.setItem("token", data.access_token);
            localStorage.setItem("role", data.role);
            window.location.href = "/static/index.html"; // Redirect to dashboard
        } else {
            errorMsg.innerText = data.message;
        }
    }
</script>
</body>
</html>
